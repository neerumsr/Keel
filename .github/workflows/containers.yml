name: Containers

# Pull requests and pushes to main: build both images (no push) so a broken Dockerfile fails fast.
# Tags v*: build and publish to GitHub Container Registry as ghcr.io/<owner>/keel and ghcr.io/<owner>/keel-pro-sidecar.
on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "serve/**", "src/**", "models/**", "package*.json", "vite.config.ts", ".github/workflows/containers.yml"]
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "serve/**", "src/**", "models/**", "package*.json", "vite.config.ts", ".github/workflows/containers.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: keel
            dockerfile: Dockerfile
          - name: keel-pro-sidecar
            dockerfile: serve/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the CUDA image
        if: matrix.name == 'keel-pro-sidecar'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    name: keel image answers a decision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t keel:ci .
      - name: Run and ask one question
        run: |
          docker run -d --name keel -p 8080:8080 -e KEEL_SECRET=ci-only-not-secret keel:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/v1/status && break; sleep 2; done
          TOKEN=$(docker exec keel npm run -s keel:token)
          curl -fsS http://127.0.0.1:8080/api/v1/systemone -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"state":"I was charged twice.","questions":{"team":{"type":"choice","instructions":"Which team?","criteria":{"billing":"Payments","tech":"Bugs"}}}}' \
            | tee /tmp/answer.json
          grep -q '"choice":"billing"' /tmp/answer.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/systemone -d '{}')" = 401
