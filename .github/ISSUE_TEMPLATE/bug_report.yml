name: Bug report
description: Something in the server, wire, MCP bridge or tooling does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a **wrong decision** (the model picked a bad answer), use the
        "Model quality report" template instead. For a **vulnerability**, do not open an issue:
        use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands and, if relevant, a minimal request body. Remove secrets and private text.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
  - type: input
    id: version
    attributes:
      label: Keel version and model id
      description: package.json version and the `model` field from a /v1/systemone response (e.g. decider-3.0.0).
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - HTTP API (/api/v1/systemone, /switch, /status, /models)
        - MCP server (keel-mcp)
        - Web UI
        - Copilot agent files
        - Training / export scripts
        - Benchmarks
        - Other
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, CPU architecture, Node version (`node --version`), Python version if relevant.
    validations:
      required: true
