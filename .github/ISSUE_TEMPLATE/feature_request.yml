name: Feature request
description: Suggest a capability, integration or wire extension.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Keel do? If it changes the wire, show a request and response.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with project principles
      options:
        - label: This keeps the decision path local (no network call while deciding).
        - label: This keeps the System One wire compatible (or proposes a versioned extension).
