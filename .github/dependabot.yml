version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # serve/requirements.txt is pinned to the versions the published numbers were measured with.
  # Bumps change model outputs, so they are reviewed by hand (see CONTRIBUTING.md) rather than automated.
